[project]
name = "face-id"
version = "0.1.0"
description = "Face-ID: reconstructing individual face-impression spaces from sparse multi-arrangement data (Xu et al. 2026, OSF nm7y8)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.7",
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "matplotlib>=3.9",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "pyarrow>=16",
  "tabulate>=0.9",
  "icecream>=2.1",
  "rsatoolbox>=0.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/face_id"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
